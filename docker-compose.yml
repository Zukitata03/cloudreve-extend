services:
  cloudreve:
    # Prebuilt by GitHub Actions on every push to master/develop of this repo
    # (frontend is fetched from the cloudreve-extend-FE fork during the CI
    # build). Deploy = git pull && docker compose pull && docker compose up -d
    image: ghcr.io/zukitata03/cloudreve-extend:latest
    container_name: cloudreve-backend-cloudreve
    depends_on:
      - postgresql
      - redis
    restart: unless-stopped
    ports:
      # Set LAN_IP and TAILSCALE_IP in the untracked .env file.
      - "${LAN_IP:?LAN_IP must be set in .env}:6888:6888"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:6888:6888"
      - "${LAN_IP:?LAN_IP must be set in .env}:6888:6888/udp"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:6888:6888/udp"
    environment:
      - CR_CONF_Database.Type=postgres
      - CR_CONF_Database.Host=postgresql
      - CR_CONF_Database.User=cloudreve
      - CR_CONF_Database.Password=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - CR_CONF_Database.Name=cloudreve
      - CR_CONF_Database.Port=5432
      - CR_CONF_Redis.Server=redis:6379
      # Trust Caddy's forwarded headers so Cloudreve logs real client IPs.
      - CR_CONF_System.ProxyHeader=X-Forwarded-For
      # Self-registration is disabled in code; set ALLOW_REGISTER=1 in .env
      # to re-enable the register API without rebuilding the image.
      - CR_ALLOW_REGISTER=${ALLOW_REGISTER:-0}
    volumes:
      - /data/cloudreve:/cloudreve/data

  caddy:
    build: ./caddy
    container_name: cloudreve-backend-caddy
    depends_on:
      - cloudreve
    restart: unless-stopped
    ports:
      # Expose 80 (HTTP -> redirects to HTTPS) and 443 (HTTPS) on the LAN
      # and Tailscale IPs only. Port 80 is required for HTTP->HTTPS redirects;
      # the certificate itself is obtained via DNS-01 over the Alibaba API.
      - "${LAN_IP:?LAN_IP must be set in .env}:80:80"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:80:80"
      - "${LAN_IP:?LAN_IP must be set in .env}:443:443"
      - "${TAILSCALE_IP:?TAILSCALE_IP must be set in .env}:443:443"
    environment:
      - ALIDNS_ACCESS_KEY_ID=${ALIDNS_ACCESS_KEY_ID:?ALIDNS_ACCESS_KEY_ID must be set in .env}
      - ALIDNS_ACCESS_KEY_SECRET=${ALIDNS_ACCESS_KEY_SECRET:?ALIDNS_ACCESS_KEY_SECRET must be set in .env}
      - OFFICE_PUBLIC_IP=${OFFICE_PUBLIC_IP:?OFFICE_PUBLIC_IP must be set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgresql:
    # Best practice: Pin to major version.
    # NOTE: For major version jumps:
    # backup & consult https://www.postgresql.org/docs/current/pgupgrade.html
    image: postgres:17
    container_name: cloudreve-backend-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cloudreve
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=cloudreve
    volumes:
      - database_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cloudreve-backend-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  database_postgres:
  redis_data:
  caddy_data:
  caddy_config:
